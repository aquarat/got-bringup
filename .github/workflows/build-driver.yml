# Build a Fedora Asahi Remix package of the patched Honeykrisp driver.
#
# The driver source is NOT in this repository. It is the Mesa commit pinned in
# mesa-source.env, which packaging/make-srpm.sh clones and exports. Moving that
# pin is what produces a new package.
#
# Runs on GitHub's aarch64 runners inside a Fedora container, because the
# package is for aarch64 and cross-building Mesa is not worth the trouble when
# native runners are free for public repositories.

name: build driver package

on:
  push:
    branches: ['**']
    paths:
      - 'mesa-source.env'
      - 'packaging/**'
      - 'build-driver.sh'
      - '.github/workflows/build-driver.yml'
  pull_request:
    paths:
      - 'mesa-source.env'
      - 'packaging/**'
      - '.github/workflows/build-driver.yml'
  workflow_dispatch:
    inputs:
      fedora_release:
        description: 'Fedora release to build against'
        default: '44'
        type: string
      publish:
        description: 'Publish a GitHub release with the built packages'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        fedora: ['${{ inputs.fedora_release || 44 }}']

    steps:
      - uses: actions/checkout@v5

      - name: Build the RPM in a Fedora ${{ matrix.fedora }} container
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            "registry.fedoraproject.org/fedora:${{ matrix.fedora }}" \
            packaging/ci-build.sh

      # Signing is opt-in and stays silent when no key is configured: the
      # secret cannot exist until somebody creates one (packaging/SIGNING.md),
      # and refusing to build until then would be theatre. If a key IS present
      # and signing fails, sign-rpms.sh exits non-zero and this job fails --
      # quietly shipping unsigned packages after being asked to sign them is
      # the one outcome worth failing over.
      - name: Sign the packages
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e RPM_GPG_PRIVATE_KEY -e RPM_GPG_PASSPHRASE \
            "registry.fedoraproject.org/fedora:${{ matrix.fedora }}" \
            bash -c 'dnf -y install --setopt=install_weak_deps=False rpm-sign gnupg2 >/dev/null &&
                     packaging/sign-rpms.sh out'

      - name: What was built
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          ls -la out
          for f in out/*.rpm; do
            echo "=== $f"
            rpm -qip "$f" 2>/dev/null | sed 's/^/  /' || true
          done

      - uses: actions/upload-artifact@v5
        with:
          name: honeykrisp-got-fc${{ matrix.fedora }}
          path: |
            out/*.rpm
            out/RPM-GPG-KEY-honeykrisp-got
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release is named after the driver commit it contains, which is
          # the only thing that identifies it. Re-running over the same pin
          # updates that release rather than making a second one.
          . ./mesa-source.env
          tag="driver-${MESA_COMMIT:0:12}"
          notes=$(mktemp)
          {
            echo "Honeykrisp Vulkan driver for Fedora Asahi Remix ${{ matrix.fedora }}, built from"
            echo "\`$MESA_REPO\` \`$MESA_BRANCH\` at \`$MESA_COMMIT\`."
            echo
            echo "Installing changes nothing on its own. See [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/INSTALL.md)."
            echo
            echo '```'
            echo "sudo dnf config-manager addrepo --from-repofile=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/honeykrisp-got.repo"
            echo "sudo dnf install honeykrisp-got"
            echo "sudo honeykrisp-got enable"
            echo "honeykrisp-got user-config"
            echo '```'
            echo
            echo "Or install the package below directly:"
            echo
            echo '```'
            echo "sudo dnf install ./$(basename "$(ls out/honeykrisp-got-[0-9]*.aarch64.rpm | grep -v debug | head -1)")"
            echo '```'
            if [ -f out/RPM-GPG-KEY-honeykrisp-got ]; then
              echo
              echo "Packages are signed; the public key is attached as \`RPM-GPG-KEY-honeykrisp-got\`."
            else
              echo
              echo "**These packages are unsigned.**"
            fi
          } > "$notes"
          # Binary packages only. The srpm is 131 MB -- it carries the whole
          # Mesa tarball -- and anyone who wants it can regenerate it from
          # mesa-source.env with packaging/make-srpm.sh. It stays a CI artifact.
          #
          # The public key ships with every release. The dnf-repo workflow
          # collects it from here, and a signature nobody can check is not a
          # signature.
          assets=(out/*.aarch64.rpm)
          [ -f out/RPM-GPG-KEY-honeykrisp-got ] && assets+=(out/RPM-GPG-KEY-honeykrisp-got)
          gh release create "$tag" "${assets[@]}" \
            --title "honeykrisp-got ${MESA_COMMIT:0:12} (fc${{ matrix.fedora }})" \
            --notes-file "$notes" || \
          gh release upload "$tag" "${assets[@]}" --clobber

      # The repository at github.io is built from release assets, so it has to
      # be rebuilt after one changes. The release event does that on its own;
      # this is here for the case where the release already existed and only
      # its assets were replaced, which does not fire one.
      - name: Rebuild the dnf repository
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dnf-repo.yml --ref "$GITHUB_REF_NAME" || true
