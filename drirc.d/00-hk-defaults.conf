<?xml version="1.0"?>
<!--
  Honeykrisp's own vkd3d/DXVK profile, replicated here because it never reaches
  the game otherwise.

  src/asahi/vulkan/00-hk-defaults.conf ships these options upstream, but the
  driver only looks for it in $DATADIR/drirc.d. Two things defeat that here:
  Fedora's mesa package does not ship 00-hk-defaults.conf at all (only
  00-mesa-defaults.conf and 00-radv-defaults.conf), and the locally built
  driver deployed to /usr/lib64 has DATADIR compiled to its own install prefix,
  which is not visible inside the pressure-vessel mount namespace the game runs
  in.

  The symptom: Ghost of Tsushima logs "[D3D] Max supported feature level: 11.0".
  That is exactly what vkd3d reports when vertexPipelineStoresAndAtomics is
  missing -- the option below whose upstream comment reads "Needed for FL11_1".

  $HOME/.drirc is parsed unconditionally, in addition to whatever DATADIR
  search happens, so putting them here works regardless of where the driver was
  built or how the container is assembled.

  Keep in sync with src/asahi/vulkan/00-hk-defaults.conf.
-->
<driconf>
    <device driver="hk">
        <engine engine_name_match="DXVK|vkd3d">
           <!-- Upstream: "The amount of bug reports we get about Honeykrisp
                being slow outweighs the number of games that need custom
                border emulation." -->
           <option name="hk_disable_border_emulation" value="true" />
           <!-- Upstream: "Needed for FL11_1. While nominally conformant, CTS
                hits piles of timeouts ... Therefore the feature is hidden." -->
           <option name="hk_enable_vertex_pipeline_stores_atomics" value="true" />
       </engine>

        <engine engine_name_match="vkd3d">
            <!-- Upstream: "Apple hardware lacks min/max filtering, but this is
                 required for FL12_0 ... we prefer to fake support and fail D3D
                 conformance rather than be limited to FL11." -->
            <option name="hk_fake_minmax" value="true" />
            <!-- Upstream: "We need this for FL12_0, but we only implement it
                 for vkd3d because it's not the speediest thing." -->
            <option name="hk_image_view_min_lod" value="true" />
        </engine>
    </device>
</driconf>
